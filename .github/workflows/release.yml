name: release
# A tag vX.Y.Z is a release: it must sit on main, the suite must pass, manifest.json must carry
# the same version, and CHANGELOG.md must have that version's section, which becomes the notes.
on:
  push:
    tags: ["v*"]
permissions: {contents: write}
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: {fetch-depth: 0}
      - name: tag is on main and matches the manifest
        run: |
          v=${GITHUB_REF_NAME#v}; m=$(jq -r .version manifest.json)
          [[ $m == "$v" ]] || { echo "manifest.json says $m, tag says $v"; exit 1; }
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "tag is not on main"; exit 1; }
      # The registry authors recipes.json, so the release runs the same checks CI runs: the suite,
      # the file's schema, and the currency of the copy vendored here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sybil-solutions/local-ai-registry
          path: registry
      - name: tests and the recipes.json checks
        run: make check REGISTRY="$GITHUB_WORKSPACE/registry"
      - name: the release archive is what an install contains
        run: make bundle && tar -tzf dist/*.tar.gz
      - name: notes from the changelog
        run: |
          v=${GITHUB_REF_NAME#v}
          awk -v v="$v" '/^## \[/{p=($0 ~ "\\["v"\\]")} p' CHANGELOG.md | tail -n +2 >notes.md
          [[ -s notes.md ]] || { echo "no CHANGELOG section for $v"; exit 1; }
      - name: publish
        env: {GH_TOKEN: "${{ github.token }}"}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
      # dev carries on from the release, so the next release pull request shows only what is new
      - name: merge the release into dev
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git fetch origin dev
          git checkout -B dev origin/dev
          git merge --no-edit "$GITHUB_SHA"
          git push origin dev
