name: pages
# The wiki under wiki/ is the site. It is built here rather than committed, so what is published is
# always the markdown in this commit — one source of truth, and a stale generated file cannot rot.
on:
  push:
    branches: [main]
    paths: ["wiki/**", ".github/workflows/pages.yml"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: {python-version: "3.12"}
      - name: Check the pages against the tree they document
        run: python3 wiki/verify.py
      - name: Build the wiki
        run: |
          python3 -m pip install --quiet 'markdown>=3.5'
          python3 wiki/build.py
          test -s wiki/index.html || { echo "the build produced no html"; exit 1; }
          mkdir -p _site && cp wiki/index.html _site/index.html
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with: {path: _site}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4