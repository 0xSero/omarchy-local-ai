name: registry
# Generate a checked catalog for a release PR. Refresh models reaches the registry between releases.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sybil-solutions/local-ai-registry
          path: registry
      - name: Generate and check the release catalog
        run: |
          if make sync-check REGISTRY=registry; then
            echo "Catalog content is current; provenance-only changes need no release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          make sync REGISTRY=registry
          make check REGISTRY="$GITHUB_WORKSPACE/registry"
          for f in bin/* test/*; do bash -n "$f"; done
          git diff -- recipes.json > registry-catalog.patch
          {
            echo "Catalog changed. Open a release PR with this patch; normal CI and branch protection apply."
            echo "Plugin base: $(git rev-parse HEAD); registry: $(git -C registry rev-parse HEAD)"
            # shellcheck disable=SC2016
            echo 'Apply on that plugin base with `git apply registry-catalog.patch`, then open the release PR.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: registry-catalog
          path: registry-catalog.patch
          if-no-files-found: ignore
