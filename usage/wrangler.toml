name = "local-ai-usage"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false
# no *.workers.dev address and no per-version preview addresses: only usage.sybilsolutions.ai answers
preview_urls = false
routes = [{ pattern = "usage.sybilsolutions.ai", custom_domain = true }]

[[d1_databases]]
binding = "DB"
database_name = "local-ai-usage"
database_id = "cfc57bc7-92eb-4c01-9d94-ec8a444a7675"
migrations_dir = "migrations"

# per caller address, in memory only; an install pings at most twice a day
[[ratelimits]]
name = "LIMIT"
namespace_id = "1001"
simple = { limit = 20, period = 60 }

# no request logs: Cloudflare would keep each request's address and headers, which the worker itself never stores
[observability]
enabled = false
[observability.logs]
enabled = false
invocation_logs = false
