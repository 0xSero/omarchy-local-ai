<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Local AI preview</title>
<!-- The marketplace listing image, 1600x900. Rendered by build.py, which places the circles, the labels and the lines.
     Local AI in the middle, the coding agents scattered around it, the GPU makers on the far side, one orange line each.
     No version and no count, so nothing in it goes stale. The palette is the marketplace's own. -->
<style>
  @font-face { font-family: "JBM"; font-weight: 400; src: url("file://{{FONT_DIR}}/JetBrainsMonoNerdFont-Regular.ttf"); }
  @font-face { font-family: "JBM"; font-weight: 700; src: url("file://{{FONT_DIR}}/JetBrainsMonoNerdFont-Bold.ttf"); }
  :root {
    --bg: #000; --disc: #101012; --text: #d7d7d9; --faint: #8b8b92; --accent: #ff5a36; --ink: #0b0b0c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1600px; height: 900px; background: var(--bg); overflow: hidden; }
  body { font-family: "JBM", ui-monospace, monospace; color: var(--text); position: relative; -webkit-font-smoothing: antialiased; }
  svg.lines { position: absolute; left: 0; top: 0; }
  .box { position: absolute; }

  .logo { display: block; color: var(--text); }
  .logo svg, .logo img { display: block; width: 100%; height: 100%; object-fit: contain; }
  .logo img { filter: grayscale(1) brightness(1.35); }

  /* the header: Omarchy, and what this is */
  .eyebrow { display: flex; align-items: center; gap: 14px; height: 40px; font-size: 24px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); white-space: nowrap; }
  .eyebrow .logo { width: 36px; height: 36px; color: var(--accent); }

  /* a coding agent: its logo in a circle, its name outside */
  .agent { border-radius: 50%; border: 2px solid rgba(255, 90, 54, .55); background: var(--disc); display: flex; align-items: center; justify-content: center; }
  .agent .logo { width: 64px; height: 64px; }
  .name { text-align: center; font-size: 22px; color: var(--faint); white-space: nowrap; }

  /* a GPU maker: the whole logo, in a bigger circle */
  .maker { border-radius: 50%; border: 3px solid var(--accent); background: var(--disc); display: flex; align-items: center; justify-content: center; }
  .maker .logo { width: 172px; height: 84px; }

  /* Local AI */
  .hub { border-radius: 50%; background: var(--accent); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
  .hub .big { font-size: 48px; line-height: 1; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; }
  .hub .ip { margin-top: 14px; font-size: 30px; line-height: 1; font-weight: 700; white-space: nowrap; }
  .hub .sub { margin-top: 12px; font-size: 21px; line-height: 1; white-space: nowrap; opacity: .75; }
</style>
</head>
<body>
  <svg class="lines" width="1600" height="900" viewBox="0 0 1600 900" aria-hidden="true">{{LINES}}</svg>

  <div class="box eyebrow fit" style="left:64px;top:64px">{{EYEBROW_LOGO}}<span>Omarchy bar widget</span></div>
  {{NODES}}

<script>
  // Layout self-check, read back by build.py: nothing may overflow or leave the canvas, and every logo must have drawn.
  document.fonts.ready.then(() => {
    const bad = [];
    document.querySelectorAll(".fit").forEach(e => { if (e.scrollWidth > e.clientWidth + 1) bad.push("overflow:" + e.textContent.trim().slice(0, 24)); });
    document.querySelectorAll(".box").forEach(e => {
      const r = e.getBoundingClientRect();
      if (r.left < 63 || r.right > 1537 || r.top < 63 || r.bottom > 837) bad.push("out:" + e.textContent.trim().slice(0, 16) + " " + Math.round(r.left) + "," + Math.round(r.top) + "," + Math.round(r.right) + "," + Math.round(r.bottom));
    });
    document.querySelectorAll(".logo").forEach(e => {
      const g = e.firstElementChild;
      if (!g) { bad.push("logo missing"); return; }
      const r = g.getBoundingClientRect();
      if (r.width < 8 || r.height < 8) bad.push("logo has no size");
      if (g.tagName === "IMG" && !(g.complete && g.naturalWidth > 0)) bad.push("logo not loaded");
      if (g.tagName.toLowerCase() === "svg") {  // a logo that paints itself dark would be invisible on the disc
        const shapes = [...g.querySelectorAll("path, rect, circle, polygon, ellipse")];
        const lit = shapes.filter(n => { const c = getComputedStyle(n).fill.match(/\d+/g); return c && (0.3 * c[0] + 0.59 * c[1] + 0.11 * c[2]) > 100; });
        if (!shapes.length || lit.length * 2 < shapes.length) bad.push("logo too dark " + lit.length + "/" + shapes.length);
      }
    });
    document.body.setAttribute("data-check", bad.length ? "FAIL " + bad.join("; ") : "OK");
  });
</script>
</body>
</html>
